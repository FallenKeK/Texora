name: release
on:
  push:
    tags: ['v*']
  # ручной запуск: тег v<AppVersion> создаётся при публикации на проверенном коммите
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Version matches tag
        shell: pwsh
        run: |
          $line = Select-String -Path ui.go -Pattern 'const AppVersion = "(.+)"'
          $ver = $line.Matches[0].Groups[1].Value
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
            if ($ver -ne $tag) { Write-Error "AppVersion $ver не совпадает с тегом $tag"; exit 1 }
          }
          "VERSION=$ver" | Add-Content $env:GITHUB_ENV
      - name: Test
        shell: pwsh
        run: |
          go test ./...
          exit $LASTEXITCODE
      - name: Build
        run: go build -ldflags "-H windowsgui -s -w" -o Texora.exe .
      - name: Smoke run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\Texora.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "Texora.exe завершился при запуске: $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "release/$env:VERSION.md"
          if (-not (Test-Path $notes)) { "Texora $env:VERSION" | Set-Content $notes }
          gh release create "v$env:VERSION" Texora.exe --target $env:GITHUB_SHA --title "Texora $env:VERSION" --notes-file $notes
